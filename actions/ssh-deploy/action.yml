name: SSH deploy
description: "Rsync deploy/ to host, write IMAGE_TAG to .env, docker compose pull && up -d --wait. Atomic-ish: pull all images first, then up"

inputs:
  deploy_host:
    required: true
  deploy_user:
    required: false
    default: deploy
  deploy_path:
    required: true
  compose_file:
    required: false
    default: docker-compose.yml
  image_tag:
    required: false
    default: ""
    description: "Image tag to deploy (sha-XXXXXXX). If 'rollback' is true, this is ignored and previous-tag is used."
  rollback:
    required: false
    default: "false"
    description: "If 'true', deploy from previous-tag file instead of image_tag input"
  ssh_key:
    required: true
  ssh_port:
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - name: Configure SSH
      shell: bash
      run: |
        mkdir -p ~/.ssh
        echo "${{ inputs.ssh_key }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p ${{ inputs.ssh_port }} -H ${{ inputs.deploy_host }} >> ~/.ssh/known_hosts 2>/dev/null

    - name: Sync deploy/ artifacts (skip on rollback)
      if: inputs.rollback != 'true'
      shell: bash
      run: |
        if [ -d deploy ]; then
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ inputs.ssh_port }}" \
            deploy/ \
            ${{ inputs.deploy_user }}@${{ inputs.deploy_host }}:${{ inputs.deploy_path }}/
        else
          echo "::warning::No deploy/ directory in repo; skipping rsync"
        fi

    - name: Determine target tag
      id: target
      shell: bash
      run: |
        if [ "${{ inputs.rollback }}" = "true" ]; then
          TAG=$(ssh -i ~/.ssh/deploy_key -p ${{ inputs.ssh_port }} \
            ${{ inputs.deploy_user }}@${{ inputs.deploy_host }} \
            "cat ${{ inputs.deploy_path }}/previous-tag 2>/dev/null || echo ''")
          if [ -z "$TAG" ]; then
            echo "::error::No previous-tag file on host; cannot rollback"
            exit 1
          fi
          echo "::notice::Rolling back to $TAG"
        else
          TAG="${{ inputs.image_tag }}"
        fi
        echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

    - name: Update .env IMAGE_TAG and pull
      shell: bash
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ inputs.ssh_port }} \
          ${{ inputs.deploy_user }}@${{ inputs.deploy_host }} bash -s <<'REMOTE'
        set -euo pipefail
        cd "${{ inputs.deploy_path }}"

        # Initialize tag history files if missing
        touch current-tag previous-tag

        # Update .env with new IMAGE_TAG (preserve other variables)
        if [ -f .env ]; then
          grep -v '^IMAGE_TAG=' .env > .env.tmp 2>/dev/null || true
          mv .env.tmp .env
        fi
        echo "IMAGE_TAG=${{ steps.target.outputs.tag }}" >> .env

        # Pre-pull all images to validate availability before swap
        docker compose -f "${{ inputs.compose_file }}" pull

        # Bring stack up with --wait (Compose v2.17+ atomic-ish)
        docker compose -f "${{ inputs.compose_file }}" up -d --wait --remove-orphans
        REMOTE

    - name: Update tag history (success path only)
      if: inputs.rollback != 'true'
      shell: bash
      run: |
        ssh -i ~/.ssh/deploy_key -p ${{ inputs.ssh_port }} \
          ${{ inputs.deploy_user }}@${{ inputs.deploy_host }} bash -s <<'REMOTE'
        set -euo pipefail
        cd "${{ inputs.deploy_path }}"
        if [ -s current-tag ]; then
          mv current-tag previous-tag
        fi
        echo "${{ steps.target.outputs.tag }}" > current-tag
        REMOTE

    - name: Cleanup SSH key
      if: always()
      shell: bash
      run: rm -f ~/.ssh/deploy_key
