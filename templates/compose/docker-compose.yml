# Server-side compose file. Copied to /srv/{company}/{env}/ by ssh-deploy.
# IMAGE_TAG is set by the deploy action; other env vars come from .env (manual).
#
# Default stack: app + PostgreSQL (Paperclip standard).
# If your app uses SQLite or no database, delete the `db` service block and
# the `depends_on` entry on `app`.

services:
  app:
    image: ghcr.io/mv50000/COMPANY:${IMAGE_TAG}
    container_name: COMPANY-app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/srv/data
      - ./logs:/srv/logs
    healthcheck:
      test: ["CMD", "curl", "-sSf", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # PostgreSQL — Paperclip standard data store.
  # In .env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, plus the same
  # values exposed as DB_USER / DB_PASSWORD / DB_NAME / DB_HOST=db / DB_PORT=5432
  # for the app to consume (or use whatever variable names your code expects).
  # Connection string template: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  db:
    image: postgres:17-alpine
    container_name: COMPANY-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  db-data:
