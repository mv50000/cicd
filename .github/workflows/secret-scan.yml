name: Secret Scan (reusable)

# Reusable gitleaks gate for RK9 repos.
#
# On pull_request it scans ONLY the PR's own commits (base..head), so it BLOCKS a
# merge that INTRODUCES a secret while ignoring secrets already in history (no
# false-fail on legacy/fixture secrets). `--redact` keeps secret values out of the
# CI log. On any non-PR trigger it scans the full working tree.
#
# A repo opts in by adding a job to its PR-check workflow:
#
#   secret-scan:
#     uses: mv50000/cicd/.github/workflows/secret-scan.yml@main
#     with:
#       runner_label: '["self-hosted","paperclip-01"]'   # this repo's PR runner
#
# Allowlist a known false positive with a repo-root .gitleaks.toml (auto-detected).

on:
  workflow_call:
    inputs:
      runner_label:
        type: string
        required: false
        default: '["ubuntu-latest"]'
        description: 'JSON array of runner labels, e.g. ["self-hosted","paperclip-01"]'
      gitleaks_version:
        type: string
        required: false
        default: "8.24.3"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ${{ fromJSON(inputs.runner_label) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="${{ inputs.gitleaks_version }}"
          INSTALL_DIR="${RUNNER_TEMP}/gitleaks-${GITLEAKS_VERSION}"
          if [ ! -x "$INSTALL_DIR/gitleaks" ]; then
            mkdir -p "$INSTALL_DIR"
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              | tar xz -C "$INSTALL_DIR"
          fi
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Run gitleaks (PR-diff scope; blocks on newly introduced secrets)
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            echo "Scanning PR commits ${BASE}..${{ github.sha }} — only secrets THIS PR introduces fail the gate."
            gitleaks detect --source . \
              --log-opts "${BASE}..${{ github.sha }}" \
              --redact --verbose --exit-code 1
          else
            echo "No PR base (non-PR trigger) — scanning full working tree."
            gitleaks detect --source . --redact --verbose --exit-code 1
          fi
